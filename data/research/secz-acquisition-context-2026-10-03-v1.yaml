reason: >-
  Retrospective source-only review of reported Securitize, Inc. subsidiary
  acquisition accounting, not a newly completed parent transaction. The annual
  prospectus Note 3 uses MG Stover, Inc.; the interim Note 3 uses MG Stover LLC.
  The S-1 R30 narrative contains both headings, and R90 labels the acquisition
  member MG Stover, LLC (secz_MGStoverLLCMember). Each selected disclosure states
  consolidation from the 2025-04-15 acquisition date. The purchase allocation
  agrees in raw USD: consideration 21090525; customer relationships 9400000;
  prepaid expenses 109538; identifiable assets 9509538; accounts payable -991616;
  deferred revenue -462398; liabilities -1454014; net identifiable assets 8055524;
  goodwill 13035001; net assets acquired 21090525. These are acquisition-date
  amounts, not annual revenue, present parent debt/cash or market valuation.
  Reported revenue remains separate from acquisition pro forma: prospectus
  FY2025/FY2024 actual totals 62152140/18636170 versus pro forma 68938369/42492286;
  interim Q2/H1 2025 actual totals 15262176/29296195 versus pro forma
  16253221/35365979. Pro forma assumes earlier acquisition and is not actual
  realized revenue or a forecast. Acquisition-date inclusion is not organic
  like-for-like growth. Matching dates/amounts and the XBRL label corroborate
  financial presentation but do not resolve the Inc./LLC legal naming conflict.
  Legal equivalence and full cross-filing correction history remain unverified.
  Preserve the version-1 acquisition_treatment null and all three formal TTM
  outputs null. No financial inputs, assumptions, model periods or graph edges
  are updated; no additional thesis period, promotion or investability clearance.
