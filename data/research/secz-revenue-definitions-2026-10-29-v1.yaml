limitations:
  - 查閱的兩份收入表均只分 Tokenization／Asset Servicing；沒有六類模型的完整互斥金額。
  - 收入認列時點與重複性不同；整類收入不能全部當作 SaaS 或經常性收入。
  - 六類的分配比例、剩餘金額與未披露類別均未知；不能填零或等分。
  - 法律主體名稱衝突、TTM 可比性假設與母公司股本估值另行保留；本次未解決。
