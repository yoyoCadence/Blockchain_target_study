  "reason": "回顧 2026-07-01 closing-date 的轉售登記範圍，非新的發行或目前股本確認。獨立研究紀錄保存 50 列原始欄位、108 個 OBSERVED（9 個破折號為 null）及 7 條 v1 算術公式／完整依賴。common 欄加總 144479908、披露 earnout 數值加總 7088616，合計對上申報費表 151568524。JD6 第 7 註腳 common 包含 3711658 權證標的，扣除後對上 Exhibit 5.1 的 140768250 已發行轉售股。earnout 欄含 1800000 已發行 Sponsor 條件股，扣除後為 5288616，與公司額外 earnout 上限 6250000 相差 961384；機械差額不是原因查證。S-1 的 stated-after／before 差額等於登記總數，不能推定全部轉售都是新發行；原分類衝突保留。未新增金融輸入、估值、圖譜或法律／個人可投資性結論，未知值與原正式 TTM null 保留。",
