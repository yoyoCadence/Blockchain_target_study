    rationale: >-
      OBSERVED is the approved nominal annual budget rate, explicitly stated
      in executed proposal 93. It is not actual annual distribution, spend,
      new token issuance or permanent dilution. The first unlock is 2026-01-01;
      model basis avoids posing an authorization schedule as a completed
      accounting year. Execution receipt at block 24106378 is successful,
      contains ProposalExecuted(93) at log 23, and approves 40M UNI to vesting
      address 0xCa046A83EDB78F74aE338bb5A291bF6FdAc9e1D2 at log 17.
      Receipt timestamp is 2025-12-27T20:33:11Z. Agora displays execution on
      2025-12-28 UTC (2025-12-29 in Asia/Taipei); retain this date conflict,
      using the transaction receipt for event time. Allowance can be revoked
      and the quarterly schedule can change. No assertion about October
      2026 settings, actual tranches, aggregate fee capture or token price.
