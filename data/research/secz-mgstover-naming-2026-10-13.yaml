reason: 依決策 D-20261012-04 以研究專用 SEC 聯絡信箱（不寫入公開 repo）直接取得 EDGAR 原始檔案，查證 SECZ 收購標的 MG Stover 的法律名稱沿革。全文檢索 "MG Stover" 共 14 份文件，2026-10-12 與 10-13 兩次取得的 filing SHA-256 全部相同（SEC 傳送層每次插入的隨機 script 已排除，當次完整回應 hash 另存）。43 段原文 bytes 摘錄（位移與 SHA-256）與 7 項觀測保存於 data/research/secz-mgstover-naming-2026-10-13-v1.json，exact bytes SHA-256 9641cf34584ec7f95aad3722d223cc0d26cea6309b76ff74baa81fff84bd12bd。觀測：年度 Note 3 一律寫 MG Stover, Inc.；期中 Note 3 自 2026-05-20 S-4/A 起寫 MG Stover, LLC；8-K/A 定義詞「MG Stover LLC (“MG Stover” or "MG Stover & Co.")」；S-1／424B3 寫「Securitize Fund Services, LLC, formerly MG Stover & Co」；2026-01-28 S-4 與 DRS 則把 Securitize Fund Services, LLC 定義為 Theorem。後兩項是新的來源衝突，兩說保留。所有 Stover 前後 300 字元內沒有轉換字樣，這只是本範圍的負面結果。Inc.／LLC 法律主體等價仍未直接查證；SECZ TTM v2 假設 secz-ttm-20260630-comparability@2、原 v1 null、金融輸入、公式、情境、論點與可投資性都不變。updates=[]，只追加 15 個 tier 1 來源與完整快照。
research_review:
  reviewer: Claude Code SEC EDGAR 原文人工查證；非人類簽核
  reviewed_at: 2026-10-13T11:36:19.924Z
  rationale: 以全文檢索列出全部命中文件，逐份取得原始 bytes，排除 SEC 傳送層插入的單一隨機 script 後比較兩日 filing hash；以固定正規化 sec-html-text-v1 在每個 Stover／Fund Services 錨點附近抽出四種名稱寫法，保存原 bytes、位移與 hash，並離線重驗每段摘錄與觀測引文。名稱寫法是發行人表述，不是州政府登記；不以此解除名稱衝突。
