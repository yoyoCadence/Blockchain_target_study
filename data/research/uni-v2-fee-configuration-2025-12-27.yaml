reason: >-
  Historical executed Ethereum v2 feeTo configuration in proposal 93, not
  realized fees, UNI burn, a current-setting assertion or an aggregate fee rate.
  Successful receipt at block 24106378 (2025-12-27T20:33:11Z), log 16, targets
  factory 0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f with calldata
  F46901ED000000000000000000000000F38521F130FCCF29DB1961597BC5D2B60F995F85.
  This matches the final governance setFeeTo(TokenJar) action; log 23 records
  ProposalExecuted(93). Published pinned factory/pair logic maps a nonzero
  feeTo to feeOn, with LP minting conditional on liquidity events and growth.
  That interpretation is not deployed-bytecode equivalence verification.
  Retain the Agora/receipt timestamp conflict. V3 owner change alone does not
  prove every pool activated. The separate 100M treasury transfer is not fee
  revenue. All numerical inputs and graph edges remain unchanged/null.
