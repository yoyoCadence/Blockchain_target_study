  rationale: >-
    直接閱讀 SEC Exhibit 4.1 的承接／修訂第 1–2 節及所附原契約的定義、
    歸屬與行使第 2、5 節，交叉核對既存 10-Q Note 5 與 S-1 index 的發布日。
    將修訂後母公司股數、舊子公司條款、歸屬／行使／earnout 分開。
    本次不是完整契約法律審查，也未審查全部合併協議、當前履行或完整 S-1 登記註腳；
    S-1 全文仍超過網頁讀取器大小限制，瀏覽器連線逾時，直接下載受 SEC 自動工具存取限制。
