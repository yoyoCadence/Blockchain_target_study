reason: >-
  回顧 2026-07-01 母公司承接認股權證的歷史條款，不是新的歸屬、行使或發行事件。
  Exhibit 4.1 的修訂適用母公司普通股，上限 3711658 股、每股行使價格 USD 3.375；
  首批 927916 股、其餘三批各 927914 股，不能再套用舊子公司換股比例或 USD 15 價格。
  原契約的 2.72% 與 fully diluted 定義已刪除，不能套入現在股數重新計算權證容量。
  10-Q 在 closing 股本段披露首批已歸屬，仍將權證對應股數排除於已發行股數之外。
  歸屬不等於行使，合約亦允許淨額行使；沒有驗證目前行使、發行、其餘批次歸屬或現金流入。
  契約第 1.4 節的 earnout 權利另受合併協議條件約束，不能僅因權證尚未歸屬便當作不存在；
  尚未完成 S-1 登記表格與 6250000／7088616 earnout 類別調節，不建立額外股數結論。
  BUIDL 抵押使用的歸屬條件不是採用量或持有人收入的已完成證據。
  金融輸入、公式、假設、圖譜、估值、模型期間與論點不變，未知值保留。
research_review:
