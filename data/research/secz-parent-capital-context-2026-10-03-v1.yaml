reason: >-
  Retrospective source-only review of the July 1, 2026 parent corporate closing,
  not a new issuance or current capitalization estimate. Securitize Corp.
  (formerly Securitize Holdings, Inc.) is distinct from its operating subsidiary
  Securitize I, Inc. (formerly Securitize, Inc.). The parent 10-Q cover reports
  163265685 common shares issued and outstanding as of August 13, 2026; Note 5
  reports the same count at the July 1 closing. The July 1 count includes
  1800000 sponsor shares subject to vesting, forfeiture and transfer restrictions;
  do not add them again. It excludes up to 6250000 conditional additional earnout
  shares, 16321869 shares reserved for incentive/employee purchase plans,
  3711658 warrant underlying shares and 3681510 option/RSU underlying shares.
  These are separate disclosed capacities or conditional rights, not completed
  issuances or a mechanically additive fully diluted share count. Current
  exercises, vesting, earnout triggers and transfers remain unverified.
  June 30 financial statements concern the pre-combination holding company:
  10000 common shares and USD 1 petty cash are not post-closing consolidated
  shares or current parent cash/debt. Existing subsidiary revenue cannot be
  silently combined with that pre-closing balance sheet. The July 31 S-1 resale
  registration covers 151568524 shares, not all newly issued shares. Exhibit 5.1
  separates 140768250 already issued resale shares, 3711658 warrant underlying
  shares and up to 7088616 earnout-category shares. The opinion's earnout category
  and the 10-Q's 6250000 additional-share maximum are not reconciled here.
  Retain the S-1 indexed offering-table excerpt of 314834209 post-offering shares
  as unresolved context, not a verified current or fully diluted denominator;
  only the indexed excerpt was reviewed because the full S-1 exceeds the web
  reader size limit. Do not double-count registered resale shares. The opinion
  is dated July 30 and calls the S-1 filed July 30; EDGAR accepted July 30 at
  20:11:36 but lists filing July 31. Preserve both dates; source availability
  uses the July 31 index date. No synchronized price, current consolidated
  cash/debt, market cap or EV is established. No financial inputs, assumptions,
  formulas, graph edges, model periods or thesis states are changed; no new
  thesis period, promotion or personal investability clearance.
