    fixture: false
    rationale: 分析者 2026-10-07 決定的模型供給口徑：以 totalSupply 扣除 dead address 餘額作為模型市值的供給基準。理由：UNI 合約沒有 burn
      函式，轉入 dead address 的代幣仍計入 totalSupply（已保存官方 Uni.sol 選定行與 UNI
      供給組成研究）。這是有理由、有版本的口徑選擇，不是已驗證的流通量；其他團隊、投資人、合約或交易所持倉未分類。required_accrual、required_share 等下游經由
      uni.model_supply 繼承此依賴。
