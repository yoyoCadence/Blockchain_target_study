      end: 2025-12-31
    confidence: medium
    version: 1
    fixture: false
    rationale: 預設不排除治理 Timelock 餘額。全部排除 Timelock 只作為具名情境 timelock_excluded（敏感度參數設為 1），切換時重算模型市值與
      required-share；Timelock 是否已承諾、可支用或應排除未查證。
