$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [version, id, as_of_date, reason, affected_nodes, sources, observations, review]
properties:
  version: {const: 1}
  id: {type: string, pattern: '^[a-zA-Z0-9_-]+$'}
  as_of_date: {type: string, format: date}
  reason: {type: string, minLength: 1}
  affected_nodes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  # The engine binds these items to the existing canonical/source schemas.
  sources:
    type: array
    items: {type: object}
  observations:
    type: array
    minItems: 1
    items: {type: object}
  # Bound to event-schema.yaml's research_review schema, shared with replay.
  review: {type: object}
