version: 3
formulas:
  - id: f.market.penetration
    version: 1
    output: market.penetration
    asset: MARKET
    label: Scenario Penetration
    unit: ratio
    expression:
      op: div
      args:
        - market.equity_aum
        - market.global_equity
    period_policy: compatible
    description: Scenario Penetration
  - id: f.uni.growth_distribution
    version: 2
    output: uni.growth_distribution
    asset: UNI
    label: Growth Distribution Value
    unit: USD/year
    expression:
      op: mul
      args:
        - uni.growth_budget
        - uni.price
    period_policy: annual_rate_valuation
    rate_input: uni.growth_budget
    price_input: uni.price
    description: 歷史核准名目 UNI 年率按單筆 USD／UNI 價格折算的模型負擔；
      model／valuation_date 是報價參考日，原預算日期與來源保留。
      不代表當日額度仍有效、實際年度分配、支出或收入。
  - id: f.uni.model_supply
    version: 1
    output: uni.model_supply
    asset: UNI
    label: Model Supply Basis
    unit: UNI
    expression:
      op: sub
      args:
        - uni.total_supply
        - op: mul
          args:
            - uni.dead_balance
            - uni.supply_basis_excludes_dead
        - op: mul
          args:
            - uni.timelock_balance
            - uni.timelock_exclusion
    period_policy: same_block_point
    description: 模型供給口徑＝totalSupply − dead 餘額×口徑假設旗標 − Timelock 餘額×情境旗標。
      三個餘額必須是同一區塊時點的觀測；扣除 dead 是有理由、有版本的 ASSUMPTION，
      全部排除 Timelock 只是具名 SCENARIO timelock_excluded（預設不排除）。
      這是研究口徑，不是已驗證的流通量。
  - id: f.uni.model_market_cap
    version: 1
    output: uni.model_market_cap
    asset: UNI
    label: "Model Market Cap: Dead-Excluded Basis"
    unit: USD
    expression:
      op: mul
      args:
        - uni.price
        - uni.model_supply
    period_policy: aligned_price_valuation
    price_input: uni.price
    description: 模型市值：扣除 dead 口徑＝同分鐘收盤價×模型供給。價格必須是包含供給區塊時間的
      一分鐘 K 線收盤價（同分鐘對齊政策），不是同一瞬間成交。流通量尚未完整查證，
      不是已驗證流通市值或合理價值。
  - id: f.uni.fdv_current_supply
    version: 1
    output: uni.fdv_current_supply
    asset: UNI
    label: Current Total Supply Valuation (FDV basis)
    unit: USD
    expression:
      op: mul
      args:
        - uni.price
        - uni.total_supply
    period_policy: aligned_price_valuation
    price_input: uni.price
    description: 現行總供給估值（FDV 口徑，未含未來增發）＝同分鐘收盤價×現行 totalSupply。
      官方 UNI 原始碼保留增發機制（每 365 日單次至多 totalSupply 的 mintCap%），
      此值不代表所有未來稀釋。
  - id: f.uni.equity_revenue
    version: 1
    output: uni.equity_revenue
    asset: UNI
    label: Tokenized Equity Protocol Revenue
    unit: USD/year
    expression:
      op: mul
      args:
        - market.equity_aum
        - uni.turnover
        - uni.onchain_share
        - uni.amm_share
        - uni.market_share
        - uni.fee
    period_policy: compatible
    description: Tokenized Equity Protocol Revenue
  - id: f.uni.gross_accrual
    version: 1
    output: uni.gross_accrual
    asset: UNI
    label: Gross UNI Accrual
    unit: USD/year
    expression:
      op: add
      args:
        - uni.crypto_fees
        - uni.equity_revenue
        - uni.other_rwa
        - uni.unichain
        - uni.mev
        - uni.other_accrual
    period_policy: compatible
    description: Gross UNI Accrual
  - id: f.uni.net_accrual
    version: 2
    output: uni.net_accrual
    asset: UNI
    label: Net UNI Accrual
    unit: USD/year
    expression:
      op: sub
      args:
        - uni.gross_accrual
        - uni.growth_distribution
        - uni.other_dilution
    period_policy: valuation_compatible
    description: 模型淨累積扣除年率折算負擔與其他稀釋；沿用明示折算日，
      已知會計流量必須同日且基礎相容。缺失輸入保持 null，不當作實際年度收入。
  - id: f.uni.net_burn_yield
    version: 3
    output: uni.net_burn_yield
    asset: UNI
    label: Net Burn Yield
    unit: ratio
    expression:
      op: div
      args:
        - uni.net_accrual
        - uni.model_market_cap
    period_policy: valuation_compatible
    description: 模型淨累積／模型市值（扣除 dead 口徑）；沿用明示折算日，已知市值必須同日。
      v3 起分母改為依口徑假設推導的模型市值，繼承其假設與情境依賴。
      不代表已實現收益或投資建議。
  - id: f.uni.required_accrual
    version: 2
    output: uni.required_accrual
    asset: UNI
    label: Required UNI Accrual
    unit: USD/year
    expression:
      op: mul
      args:
        - uni.model_market_cap
        - uni.required_yield
    period_policy: compatible
    description: 所需 UNI 價值累積＝模型市值（扣除 dead 口徑）×要求收益率。v2 起由舊版直接輸入市值改為
      依口徑假設推導的模型市值；required-share 等下游繼承該假設與 Timelock 情境依賴。
  - id: f.uni.required_share
    version: 2
    output: uni.required_share
    asset: UNI
    label: Required Uniswap Market Share
    unit: ratio
    expression:
      op: div
      args:
        - op: add
          args:
            - uni.required_accrual
            - uni.growth_distribution
        - op: mul
          args:
            - market.equity_aum
            - uni.turnover
            - uni.onchain_share
            - uni.amm_share
            - uni.fee
    period_policy: valuation_compatible
    description: Conservative prompt-specified standalone tokenized-equity hurdle;
      does not offset other accrual streams or add other dilution. Not a full
      net-accrual solve. 沿用名目年率折算日；已知流量與庫存需同日且基礎相容，
      輸出為 model，不代表實際年度收入或合理價值。
  - id: f.uni.required_share_net
    version: 2
    output: uni.required_share_net
    asset: UNI
    label: "Required Share: Full Net Economics"
    unit: ratio
    expression:
      op: div
      args:
        - op: sub
          args:
            - op: add
              args:
                - uni.required_accrual
                - uni.growth_distribution
                - uni.other_dilution
            - uni.crypto_fees
            - uni.other_rwa
            - uni.unichain
            - uni.mev
            - uni.other_accrual
        - op: mul
          args:
            - market.equity_aum
            - uni.turnover
            - uni.onchain_share
            - uni.amm_share
            - uni.fee
    period_policy: valuation_compatible
    description: 完整淨經濟所需市占率，包含其他稀釋並扣除其他累積來源；
      沿用名目年率折算日，已知流量與庫存需同日且基礎相容。
      缺失輸入保持 null，不代表已實現捕獲或合理價值。
  - id: f.secz.revenue
    version: 1
    output: secz.revenue
    asset: SECZ
    label: Total Revenue
    unit: USD/year
    expression:
      op: add
      args:
        - secz.tokenization
        - secz.servicing
        - secz.transaction
        - secz.saas
        - secz.administration
        - secz.other
    period_policy: compatible
    description: Total Revenue
  - id: f.secz.revenue_growth
    version: 1
    output: secz.revenue_growth
    asset: SECZ
    label: Revenue Growth
    unit: ratio
    expression:
      op: sub
      args:
        - op: div
          args:
            - secz.revenue
            - secz.prior_revenue
        - 1
    period_policy: prior_comparison
    description: Revenue Growth
  - id: f.secz.aum_growth
    version: 1
    output: secz.aum_growth
    asset: SECZ
    label: AUM Growth
    unit: ratio
    expression:
      op: sub
      args:
        - op: div
          args:
            - secz.aum
            - secz.prior_aum
        - 1
    period_policy: prior_comparison
    description: AUM Growth
  - id: f.secz.volume_growth
    version: 1
    output: secz.volume_growth
    asset: SECZ
    label: Volume Growth
    unit: ratio
    expression:
      op: sub
      args:
        - op: div
          args:
            - secz.volume
            - secz.prior_volume
        - 1
    period_policy: prior_comparison
    description: Volume Growth
  - id: f.secz.revenue_efficiency
    version: 1
    output: secz.revenue_efficiency
    asset: SECZ
    label: Revenue Efficiency
    unit: ratio
    expression:
      op: div
      args:
        - secz.revenue_growth
        - secz.aum_growth
    period_policy: compatible
    description: Revenue Efficiency
  - id: f.secz.volume_monetization
    version: 1
    output: secz.volume_monetization
    asset: SECZ
    label: Volume Monetization
    unit: ratio
    expression:
      op: div
      args:
        - secz.revenue
        - secz.volume
    period_policy: compatible
    description: Volume Monetization
  - id: f.secz.operating_leverage
    version: 1
    output: secz.operating_leverage
    asset: SECZ
    label: Operating Leverage
    unit: ratio
    expression:
      op: div
      args:
        - op: sub
          args:
            - secz.ebitda
            - secz.prior_ebitda
        - op: sub
          args:
            - secz.revenue
            - secz.prior_revenue
    period_policy: prior_comparison
    description: Operating Leverage
  - id: f.secz.ebitda_margin
    version: 1
    output: secz.ebitda_margin
    asset: SECZ
    label: EBITDA Margin
    unit: ratio
    expression:
      op: div
      args:
        - secz.ebitda
        - secz.revenue
    period_policy: compatible
    description: EBITDA Margin
  - id: f.secz.margin_change
    version: 1
    output: secz.margin_change
    asset: SECZ
    label: EBITDA Margin Change
    unit: ratio
    expression:
      op: sub
      args:
        - secz.ebitda_margin
        - op: div
          args:
            - secz.prior_ebitda
            - secz.prior_revenue
    period_policy: prior_comparison
    description: EBITDA Margin Change
  - id: f.secz.required_fcf
    version: 1
    output: secz.required_fcf
    asset: SECZ
    label: Required FCF
    unit: USD/year
    expression:
      op: div
      args:
        - secz.ev
        - secz.multiple
    period_policy: compatible
    description: Required FCF
  - id: f.secz.required_revenue
    version: 1
    output: secz.required_revenue
    asset: SECZ
    label: Required Revenue
    unit: USD/year
    expression:
      op: div
      args:
        - secz.required_fcf
        - secz.fcf_margin
    period_policy: compatible
    description: Required Revenue
  - id: f.secz.required_cagr
    version: 1
    output: secz.required_cagr
    asset: SECZ
    label: Required Revenue CAGR
    unit: ratio
    expression:
      op: sub
      args:
        - op: pow
          args:
            - op: div
              args:
                - secz.required_revenue
                - secz.revenue
            - op: div
              args:
                - 1
                - secz.years
        - 1
    period_policy: compatible
    description: Required Revenue CAGR
  - id: f.xlm.network_fees
    version: 1
    output: xlm.network_fees
    asset: XLM
    label: Network Fee Value
    unit: USD/year
    expression:
      op: mul
      args:
        - xlm.operations
        - xlm.fee_xlm
        - xlm.price
    period_policy: compatible
    description: Network Fee Value
  - id: f.xlm.native_demand
    version: 1
    output: xlm.native_demand
    asset: XLM
    label: Native XLM Demand
    unit: XLM
    expression:
      op: add
      args:
        - xlm.reserves
        - xlm.liquidity
        - xlm.collateral
        - xlm.settlement
        - xlm.other_locked
    period_policy: compatible
    description: Disjoint inventory buckets; avoid double counting. Network fees are
      not capitalized into holder value.
  - id: f.xlm.demand_growth
    version: 1
    output: xlm.demand_growth
    asset: XLM
    label: Native Asset Demand Growth
    unit: ratio
    expression:
      op: sub
      args:
        - op: div
          args:
            - xlm.native_demand
            - xlm.prior_demand
        - 1
    period_policy: prior_comparison
    description: Native Asset Demand Growth
  - id: f.xlm.capture_ratio
    version: 1
    output: xlm.capture_ratio
    asset: XLM
    label: Economic Capture Ratio
    unit: ratio
    expression:
      op: div
      args:
        - xlm.demand_growth
        - xlm.activity_growth
    period_policy: compatible
    description: Economic Capture Ratio
