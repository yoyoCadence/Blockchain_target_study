$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
properties:
  id: &a1
    type: string
    minLength: 1
  metric_id: *a1
  asset: *a1
  value:
    type:
      - number
      - "null"
  unit:
    enum:
      - USD
      - USD/year
      - UNI
      - UNI/year
      - XLM
      - XLM/year
      - count/year
      - count
      - ratio
      - years
      - turns/year
      - bps
  classification:
    enum:
      - OBSERVED
      - DERIVED
      - ASSUMPTION
      - SCENARIO
  as_of_date: &a2
    type: string
    format: date
  period:
    type: object
    additionalProperties: false
    properties:
      basis:
        enum:
          - annual
          - quarterly
          - TTM
          - point
          - model
          - year_to_date
      end: *a2
      start: *a2
      duration_months: {type: integer, minimum: 1, maximum: 12}
    required:
      - basis
      - end
  confidence:
    enum:
      - high
      - medium
      - low
      - unknown
  statement_context:
    type: object
    additionalProperties: false
    required: [entity_name, scope, accounting_basis, audit_status]
    properties:
      entity_name: *a1
      scope: *a1
      accounting_basis: *a1
      audit_status: {enum: [audited, unaudited, mixed_audit_conditional]}
  research_reference:
    type: object
    additionalProperties: false
    required: [artifact_id, record_id]
    properties:
      artifact_id: {type: string, pattern: '^[a-f0-9]{64}$'}
      record_id: *a1
  version:
    type: integer
    minimum: 1
  fixture:
    type: boolean
  source_ids: &a3
    type: array
    items: *a1
    uniqueItems: true
  formula_id: *a1
  formula_version:
    type: integer
    minimum: 1
  dependencies: *a3
  rationale: *a1
  scenario: *a1
  valuation_date: *a2
  range:
    type: array
    items:
      type: number
    minItems: 2
    maxItems: 2
  supersedes: *a1
  # Intraday alignment evidence for point valuation inputs (block time / closed price window).
  observed_at:
    type: string
    format: date-time
  price_window:
    type: object
    additionalProperties: false
    required: [basis, start, end]
    properties:
      basis: {const: one_minute_close}
      start: {type: string, format: date-time}
      end: {type: string, format: date-time}
required:
  - id
  - metric_id
  - asset
  - value
  - unit
  - classification
  - as_of_date
  - period
  - confidence
  - version
  - fixture
allOf:
  - if:
      required: [valuation_date]
    then:
      properties:
        classification: {const: DERIVED}
        period:
          properties:
            basis: {const: model}
  - if:
      properties:
        classification:
          const: OBSERVED
    then:
      required:
        - source_ids
      properties:
        source_ids:
          minItems: 1
  - if:
      properties:
        classification:
          const: DERIVED
    then:
      required:
        - formula_id
        - formula_version
        - dependencies
      properties:
        dependencies:
          minItems: 1
  - if:
      properties:
        classification:
          const: ASSUMPTION
    then:
      required:
        - rationale
  - if:
      properties:
        classification:
          const: SCENARIO
    then:
      anyOf:
        - required:
            - scenario
        - required:
            - range
