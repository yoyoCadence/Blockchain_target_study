$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [version, records]
properties:
  version: {type: integer, minimum: 1}
  records:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, label, kind, file, expected_id]
      properties:
        id: {type: string, minLength: 1}
        label: {type: string, minLength: 1}
        kind: {enum: [identity, revenue, revenue_ttm, capital, fixed_block, token_state]}
        file: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9/_-]*\.(yaml|json)$'}
        expected_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        event_id: {type: string, pattern: '^[a-zA-Z0-9_-]+$'}
      allOf:
        - if: {properties: {kind: {enum: [fixed_block, token_state]}}}
          then: {required: [event_id]}
          else: {not: {required: [event_id]}}
