$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [version, id, fixture, purpose, capture_method, as_of_date, captured_at, targets, anchor, price_capture, basis_dependency, scenario, observations, formulas, derived, context, limitations, transport]
properties:
  version: {const: 1}
  id: &text {type: string, pattern: '\S'}
  fixture: {const: false}
  purpose: *text
  capture_method: *text
  as_of_date: &day {type: string, format: date}
  captured_at: &instant {type: string, format: date-time}
  targets: &targets
    type: object
    additionalProperties: false
    required: [token, timelock, dead_sink]
    properties:
      token: &address {type: string, pattern: '^0x[0-9a-f]{40}$'}
      timelock: *address
      dead_sink: *address
  anchor:
    type: object
    additionalProperties: false
    required: [classification, as_of_date, source_ids, chain_id, selected_tag, number_hex, number, hash, timestamp_hex, effective_at, selector, height_recheck_response_id]
    properties:
      classification: {const: OBSERVED}
      as_of_date: *day
      source_ids: &one_source {type: array, minItems: 1, maxItems: 1, items: *text}
      chain_id: {const: '1'}
      selected_tag: {const: finalized}
      number_hex: &quantity {type: string, pattern: '^0x(0|[1-9a-f][0-9a-f]*)$'}
      number: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
      hash: &hash {type: string, pattern: '^0x[0-9a-f]{64}$'}
      timestamp_hex: *quantity
      effective_at: *instant
      selector:
        type: object
        additionalProperties: false
        required: [blockHash, requireCanonical]
        properties:
          blockHash: *hash
          requireCanonical: {const: true}
      height_recheck_response_id: {type: integer, minimum: 1}
  price_capture:
    type: object
    additionalProperties: false
    required: [url, method, started_at, received_at, http_status, http_date, content_type, body_sha256, response_json, granularity_seconds, bucket_start, source_id, product, venue]
    properties:
      url: &uri {type: string, format: uri}
      method: {const: GET}
      started_at: *instant
      received_at: *instant
      http_status: {const: 200}
      http_date: *text
      content_type: *text
      body_sha256: &digest {type: string, pattern: '^[0-9a-f]{64}$'}
      response_json: *text
      granularity_seconds: {const: 60}
      bucket_start: {type: string, pattern: '^[1-9][0-9]*$'}
      source_id: *text
      product: *text
      venue: *text
  basis_dependency:
    type: object
    additionalProperties: false
    required: [archive_id, archive_sha256, source_ids]
    properties:
      archive_id: *text
      archive_sha256: *digest
      source_ids: {type: array, minItems: 1, uniqueItems: true, items: *text}
  scenario: &scenario
    type: object
    additionalProperties: false
    required: [name, rationale]
    properties:
      name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      rationale: *text
  observations:
    type: array
    minItems: 12
    maxItems: 12
    items:
      type: object
      additionalProperties: false
      required: [id, version, asset, classification, fixture, confidence, as_of_date, period, metric_id, key, label, value, unit, observed_at, source_ids]
      properties:
        id: *text
        version: {const: 1}
        asset: {const: UNI}
        classification: {const: OBSERVED}
        fixture: {const: false}
        confidence: {const: medium}
        as_of_date: *day
        period: &point
          type: object
          additionalProperties: false
          required: [basis, end]
          properties:
            basis: {const: point}
            end: *day
        metric_id: *text
        key: *text
        label: *text
        abi_type: {enum: [header.timestamp, uint256, uint8]}
        response_id: {type: integer, minimum: 1}
        response_word: {type: string, pattern: '^0x[0-9a-f]+$'}
        candle_field_index: {type: integer, minimum: 0, maximum: 5}
        raw_value: *text
        response_received_at: *instant
        value: *text
        unit: &unit {enum: [UNI raw base units, percent, unix seconds, USD/UNI, UNI]}
        observed_at: *instant
        source_ids: *one_source
      oneOf:
        - required: [abi_type, response_id, response_word]
          not: {anyOf: [{required: [candle_field_index]}, {required: [raw_value]}, {required: [response_received_at]}]}
        - required: [candle_field_index, raw_value, response_received_at]
          not: {anyOf: [{required: [abi_type]}, {required: [response_id]}, {required: [response_word]}]}
  formulas:
    type: array
    minItems: 6
    maxItems: 6
    items: {type: object}
  derived:
    type: array
    minItems: 6
    maxItems: 6
    items:
      type: object
      additionalProperties: false
      required: [id, version, asset, classification, fixture, confidence, as_of_date, period, metric_id, observed_at, value, unit, formula_id, formula_version, dependencies]
      properties:
        id: *text
        version: {const: 1}
        asset: {const: UNI}
        classification: {enum: [DERIVED, SCENARIO]}
        scenario_name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        fixture: {const: false}
        confidence: {const: medium}
        as_of_date: *day
        period: *point
        metric_id: *text
        observed_at: *instant
        value:
          oneOf:
            - {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{2})?$'}
            - {enum: [0, 1]}
        unit: {enum: [UNI raw base units, ratio, USD]}
        formula_id: *text
        formula_version: {const: 1}
        dependencies: {type: array, minItems: 2, uniqueItems: true, items: *text}
      # A scenario record must name its scenario; a derived record must not.
      if: {properties: {classification: {const: SCENARIO}}}
      then: {required: [scenario_name]}
      else: {not: {required: [scenario_name]}}
  context:
    type: object
    additionalProperties: false
    required: [verified_circulating_supply, canonical_market_cap, canonical_fdv, other_non_circulating_holdings, timelock_committed_or_spendable, future_mint_decision, volume_weighted_price, cross_venue_price, deployment_source_equivalence]
    properties:
      verified_circulating_supply: {const: null}
      canonical_market_cap: {const: null}
      canonical_fdv: {const: null}
      other_non_circulating_holdings: {const: null}
      timelock_committed_or_spendable: {const: null}
      future_mint_decision: {const: null}
      volume_weighted_price: {const: null}
      cross_venue_price: {const: null}
      deployment_source_equivalence: {const: null}
  limitations: {type: array, minItems: 1, items: *text}
  transport:
    type: object
    additionalProperties: false
    required: [probe, state, labels]
    properties:
      probe: &rpc
        type: object
        additionalProperties: false
        required: [endpoint, started_at, received_at, http_status, http_date, request_json, response_json]
        properties:
          endpoint: *uri
          started_at: *instant
          received_at: *instant
          http_status: {const: 200}
          http_date: *text
          request_json: *text
          response_json: *text
      state: *rpc
      labels:
        type: array
        minItems: 9
        maxItems: 9
        items:
          type: object
          additionalProperties: false
          required: [id, label]
          properties:
            id: {type: integer, minimum: 1}
            label: *text
definitions:
  method:
    type: object
    additionalProperties: false
    required: [id, version, archive_id, asset, chain_id, endpoint, rpc_source_id, targets, interpretation, header_label, getters, price, basis_dependency, scenario, scenario_formula_ids, bases, derived_labels, formulas]
    properties:
      id: {const: uni-aligned-valuation-review}
      version: {const: 1}
      archive_id: *text
      asset: {const: UNI}
      chain_id: {const: '1'}
      endpoint: *uri
      rpc_source_id: *text
      targets: *targets
      interpretation: *text
      header_label: *text
      getters:
        type: array
        minItems: 5
        maxItems: 5
        items:
          type: array
          minItems: 7
          maxItems: 7
          items:
            - *text
            - {enum: [uint256, uint8]}
            - *text
            - {type: string, pattern: '^0x[0-9a-f]{8}$'}
            - {type: array, maxItems: 1, items: {enum: [timelock, dead_sink]}}
            - *unit
            - *text
      price:
        type: object
        additionalProperties: false
        required: [url, source_id, product, venue, granularity_seconds, covered_metric, fields]
        properties:
          url: {type: string, pattern: '^https://api\.exchange\.coinbase\.com/products/UNI-USD/candles\?granularity=60&start=[0-9TZ:.-]+&end=[0-9TZ:.-]+$'}
          source_id: *text
          product: {const: UNI-USD}
          venue: {const: Coinbase Exchange}
          granularity_seconds: {const: 60}
          covered_metric: *text
          fields:
            const: [[candle_start, 0, unix seconds, K 線起始時間（Unix 秒）], [candle_low, 1, USD/UNI, 同分鐘最低價], [candle_high, 2, USD/UNI, 同分鐘最高價], [candle_open, 3, USD/UNI, 同分鐘開盤價], [candle_close, 4, USD/UNI, 同分鐘收盤價], [candle_volume, 5, UNI, 同分鐘成交量]]
      basis_dependency:
        type: object
        additionalProperties: false
        required: [file, archive_id, sha256, source_ids]
        properties:
          file: {type: string, pattern: '^[a-zA-Z0-9_-]+\.json$'}
          archive_id: *text
          sha256: *digest
          source_ids: {type: array, minItems: 1, uniqueItems: true, items: *text}
      scenario: *scenario
      scenario_formula_ids: {type: array, minItems: 1, uniqueItems: true, items: *text}
      bases:
        type: array
        minItems: 3
        maxItems: 3
        items: {type: array, minItems: 4, maxItems: 4, items: *text}
      derived_labels: {type: object, additionalProperties: *text}
      formulas: {type: array, minItems: 6, maxItems: 6, items: {type: object}}
