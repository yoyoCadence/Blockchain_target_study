$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [id, schema_version, kind, version, mode, fixture, as_of_date, review, context, sources, rows, observations, formulas, derived]
properties:
  id: {type: string, pattern: '^[a-f0-9]{64}$'}
  schema_version: {const: 1}
  kind: {const: secz_resale_capital_review}
  version: {type: integer, minimum: 1}
  mode: {const: production}
  fixture: {const: false}
  as_of_date: {type: string, format: date}
  review:
    type: object
    additionalProperties: false
    required: [reviewer, reviewed_at, rationale]
    properties:
      reviewer: &text {type: string, pattern: '\S'}
      reviewed_at: {type: string, format: date-time}
      rationale: *text
  context:
    type: object
    additionalProperties: false
    required: [entity, unit_definition, table_basis, unknown_policy, comparison_basis, interpretation, unresolved, known_rows]
    properties:
      entity: *text
      unit_definition: *text
      table_basis: *text
      unknown_policy: *text
      comparison_basis: *text
      interpretation: *text
      unresolved: {type: array, minItems: 1, items: *text}
      known_rows: {type: integer, minimum: 1}
  sources: {type: array, minItems: 1, items: {type: object}}
  observations: {type: array, minItems: 10, items: {type: object}}
  derived: {type: array, minItems: 7, maxItems: 7, items: {type: object}}
  rows:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [row, label, page, common_observation_id, earnout_observation_id, common_text, earnout_text]
      properties:
        row: {type: integer, minimum: 1}
        label: *text
        page: {type: integer, minimum: 1}
        common_observation_id: *text
        earnout_observation_id: *text
        common_text: &cell {type: string, pattern: '^(—|0|[1-9][0-9]*|[1-9][0-9]{0,2}(,[0-9]{3})+)$'}
        earnout_text: *cell
  formulas:
    type: array
    minItems: 7
    maxItems: 7
    items:
      type: object
      additionalProperties: false
      required: [id, version, output, unit, expression, rationale]
      properties:
        id: *text
        version: {type: integer, minimum: 1}
        output: *text
        unit: {const: count}
        expression: {type: object}
        rationale: *text
